name: validate-campus-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudfunctions/rag/package-lock.json
      - name: Install RAG dependencies
        run: npm ci --prefix cloudfunctions/rag
      - name: Run workflow tests
        run: npm test --prefix cloudfunctions/rag
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check app.js
          node --check cloudfunctions/api/index.js
          node --check cloudfunctions/crawler/index.js
          node --check pages/chat/index.js
          node --check pages/campus-wall/publish.js
      - name: Check public tree for sensitive files
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|project\.private\.config\.json|node_modules/|.*\.key$|.*\.pem$)'
